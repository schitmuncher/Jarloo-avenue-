<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarloo Avenue: Nantwich</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #eee; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 12px; left: 12px; right: 12px; font-size: 14px; line-height: 1.4;
          background: rgba(0,0,0,0.5); padding: 8px 10px; border-radius: 8px; pointer-events: none; }
  #attrib { position: fixed; bottom: 6px; right: 8px; font-size: 11px; opacity: 0.7; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Coins: <span id="coins">0</span> · Harvested: <span id="harvest">0</span><br/>
  Pull the trigger on the ground to teleport. Use a plot to till, plant, water and harvest. Use the market stall to sell.</div>
<div id="attrib">Map data © OpenStreetMap contributors (ODbL)</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cfe6);
scene.fog = new THREE.Fog(0xa9cfe6, 250, 900);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1600);
const rig = new THREE.Group(); // the player's position in world space
rig.add(camera);
scene.add(rig);

scene.add(new THREE.HemisphereLight(0xffffff, 0x4d6b3c, 1.0));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
sun.position.set(120, 200, 80);
scene.add(sun);

// ---------- Coordinates ----------
// World units are metres. The origin is the map centre (53.067132, -2.517664), the
// same centre scripts/fetch-osm.mjs uses, so OSM data and the anchor file line up.
const CENTRE = { lat: 53.067132, lon: -2.517664 };
const M_PER_DEG_LAT = 111320;
const M_PER_DEG_LON = 111320 * Math.cos(CENTRE.lat * Math.PI / 180);
const toXZ = (p) => new THREE.Vector3((p.lon - CENTRE.lon) * M_PER_DEG_LON, 0, -(p.lat - CENTRE.lat) * M_PER_DEG_LAT);

// ---------- Materials ----------
const M = (color) => new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
const groundMat = M(0x6a9a4e);
const roadMat = M(0x5b5c60);
const towpathMat = M(0x8a7a5c);
const waterMat = M(0x2f6f8f);
const squareMat = M(0xa39b8c);
const houseMat = M(0xd8c8a8);   // timber/plaster tone
const pubMat = M(0x8c3b2a);
const landmarkMat = M(0xe3b65c);
const churchMat = M(0xb9a58a);
const fenceMat = M(0x8b6b43);
const stallMat = M(0xc0392b);
const awningMat = M(0xf2efe6);
const PLOT_COLOURS = { empty: 0x6b4a2b, tilled: 0x4a2f18, planted: 0x3d6b2a, grown: 0x7fbf3f };

// ---------- Helpers ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// A flat strip along a polyline (roads, rivers, canal).
function ribbon(pts, width, mat, y) {
  const pos = [], idx = [];
  const half = width / 2;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const d = new THREE.Vector3().subVectors(b, a).normalize();
    const n = new THREE.Vector3(-d.z, 0, d.x).multiplyScalar(half);
    const p = pts[i];
    pos.push(p.x + n.x, y, p.z + n.z, p.x - n.x, y, p.z - n.z);
    if (i > 0) { const k = (i - 1) * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.userData.teleport = true;
  scene.add(m);
  return m;
}

function addLabel(text, x, y, z, style = 'plain') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = style === 'landmark' ? 'rgba(120,70,0,0.9)' : style === 'pub' ? 'rgba(90,30,20,0.9)' : 'rgba(0,0,0,0.6)';
  g.fillRect(0, 0, 512, 96);
  g.fillStyle = '#fff';
  g.font = 'bold 40px sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, 256, 48);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
  sprite.position.set(x, y, z);
  sprite.scale.set(10, 1.9, 1);
  scene.add(sprite);
}

// A box building. Width runs along local x, depth along local z, rotation.y turns it.
function addBuilding(b, mat = houseMat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.width, b.height, b.depth), mat);
  m.position.set(b.x, b.height / 2, b.z);
  m.rotation.y = b.rotation || 0;
  m.userData.building = true;
  scene.add(m);
  return m;
}

// A real building outline from OSM, extruded to its height.
function addFootprint(b, mat = houseMat) {
  // Shape is drawn in the XY plane; after rotateX(-PI/2) its y becomes world -z
  // and its extrusion becomes world up, so the shape uses (x, -z).
  const shape = new THREE.Shape(b.footprint.map(([x, z]) => new THREE.Vector2(x, -z)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: b.height, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, mat);
  m.userData.building = true;
  scene.add(m);
  return m;
}

// Terraced houses on both sides of a street, kept clear of the Square, churchyard and pubs.
function terraces(pts, streetWidth, rng, avoid) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = a.distanceTo(b);
    const dir = new THREE.Vector3().subVectors(b, a).normalize();
    const perp = new THREE.Vector3(-dir.z, 0, dir.x);
    const rot = Math.atan2(-dir.z, dir.x);
    for (let s = 6; s < len - 6; s += 7) {
      for (const side of [-1, 1]) {
        if (rng() < 0.25) continue;
        const c = a.clone().addScaledVector(dir, s).addScaledVector(perp, side * (streetWidth / 2 + 4.5));
        if (avoid(c.x, c.z)) continue;
        const storeys = 2 + Math.floor(rng() * 2);
        addBuilding({
          x: c.x, z: c.z, width: 6.5, depth: 8,
          height: storeys * 2.6 + 1.5, rotation: rot,
        });
      }
    }
  }
}

// ---------- Load the map anchors ----------
let anchors;
try {
  anchors = await (await fetch('data/nantwich-anchors.json')).json();
} catch (e) {
  document.getElementById('info').textContent =
    'Could not load data/nantwich-anchors.json. Serve this folder with a web server (for example GitHub Pages).';
  throw e;
}

// Optional full OSM footprints (scripts/fetch-osm.mjs). If absent, terraces are generated.
let osm = null;
try {
  const r = await fetch('data/nantwich.json');
  if (r.ok) osm = await r.json();
} catch { osm = null; }

// ---------- Build the world ----------
const rng = mulberry32(42);
const pubPositions = [];
const squareC = toXZ(anchors.square.centre);
const churchPos = anchors.landmarks.find((l) => /St Mary/.test(l.name));
const churchC = churchPos ? toXZ(churchPos) : null;

function avoid(x, z) {
  // Keep houses off the Square, the churchyard and the pub frontages.
  if (Math.abs(x - squareC.x) < anchors.square.widthM / 2 + 4 &&
      Math.abs(z - squareC.z) < anchors.square.depthM / 2 + 4) return true;
  if (churchC && Math.hypot(x - churchC.x, z - churchC.z) < 25) return true;
  return pubPositions.some((p) => Math.hypot(p.x - x, p.z - z) < 14);
}

// Ground: the whole mapped area, so everything sits on land.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3600, 3600), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.userData.teleport = true;
scene.add(ground);

// Streets: every named OSM street when the data is present, otherwise the anchor streets.
if (osm && osm.streets?.length) {
  for (const s of osm.streets) {
    const pts = s.points.map((p) => new THREE.Vector3(p.x, 0, p.z));
    ribbon(pts, s.widthM, roadMat, 0.05);
  }
} else {
  for (const s of anchors.streets) ribbon(s.points.map(toXZ), s.widthM, roadMat, 0.05);
}

// The Square (market place) and the market stall.
const sqMesh = new THREE.Mesh(new THREE.PlaneGeometry(anchors.square.widthM, anchors.square.depthM), squareMat);
sqMesh.rotation.x = -Math.PI / 2;
sqMesh.position.set(squareC.x, 0.06, squareC.z);
sqMesh.userData.teleport = true;
scene.add(sqMesh);

const stallC = toXZ(anchors.marketStall);
const stall = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 2), stallMat);
stall.position.set(stallC.x, 0.6, stallC.z);
stall.userData.market = true;
scene.add(stall);
const awning = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 2.6), awningMat);
awning.position.set(stallC.x, 2.4, stallC.z);
scene.add(awning);

// River and canal (towpath drawn as a wider strip beneath the water).
ribbon(anchors.river.points.map(toXZ), anchors.river.widthM, waterMat, 0.03);
const canalPts = anchors.canal.points.map(toXZ);
ribbon(canalPts, anchors.canal.widthM + 2 * anchors.canal.towpathWidthM, towpathMat, 0.02);
ribbon(canalPts, anchors.canal.widthM, waterMat, 0.03);

// Pubs and landmarks from the anchor file.
for (const p of anchors.pubs) {
  const v = toXZ(p);
  const storeys = p.storeys || 2;
  const isLandmark = /oddfellow/i.test(p.name);
  pubPositions.push(v);
  addBuilding({ x: v.x, z: v.z, width: 10, depth: 8, height: storeys * 3 + 1.5, rotation: 0 },
              isLandmark ? landmarkMat : pubMat);
  addLabel(p.name, v.x, storeys * 3 + 4, v.z, isLandmark ? 'landmark' : 'pub');
}
for (const l of anchors.landmarks) {
  const v = toXZ(l);
  if (/St Mary/.test(l.name)) {
    addBuilding({ x: v.x, z: v.z, width: 14, depth: 14, height: l.heightM || 31, rotation: 0 }, churchMat);
    addLabel(l.name, v.x, (l.heightM || 31) + 3, v.z, 'landmark');
  } else if (l.storeys) {
    addBuilding({ x: v.x, z: v.z, width: 9, depth: 8, height: l.storeys * 2.8 + 2, rotation: 0 }, houseMat);
  }
}

// Buildings: real OSM footprints if available, otherwise generated terraces.
if (osm) {
  const anchorNames = new Set([...anchors.pubs, ...anchors.landmarks].map((x) => x.name));
  for (const b of osm.buildings) {
    if (b.name && anchorNames.has(b.name)) continue;
    const mat = b.isPub ? pubMat : houseMat;
    if (b.footprint) addFootprint(b, mat);
    else addBuilding(b, mat);
  }
} else {
  for (const s of anchors.streets) terraces(s.points.map(toXZ), s.widthM, rng, avoid);
}

// Allotments (Brookfield): 5 x 3 plots, each 5 m x 10 m, with a fence around them.
const plots = [];
const ac = toXZ(anchors.allotments.centre);
const plotGeo = new THREE.BoxGeometry(5, 0.15, 10);
for (let row = 0; row < 3; row++) {
  for (let col = 0; col < 5; col++) {
    const m = new THREE.Mesh(plotGeo, M(PLOT_COLOURS.empty));
    m.position.set(ac.x + (col - 2) * 6, 0.08, ac.z + (row - 1) * 12);
    m.userData = { plot: true, state: 'empty', watered: false, timer: 0 };
    scene.add(m);
    plots.push(m);
  }
}
const fenceN = new THREE.Mesh(new THREE.BoxGeometry(38, 1.0, 0.15), fenceMat);
fenceN.position.set(ac.x, 0.5, ac.z - 20);
const fenceS = fenceN.clone(); fenceS.position.z = ac.z + 20;
const fenceW = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 40), fenceMat);
fenceW.position.set(ac.x - 19, 0.5, ac.z);
const fenceE = fenceW.clone(); fenceE.position.x = ac.x + 19;
scene.add(fenceN, fenceS, fenceW, fenceE);

// Start the player at the market stall.
rig.position.set(stallC.x, 0, stallC.z + 6);

// ---------- Economy ----------
let coins = 0, harvested = 0;
const PRICE = 5;
const coinsEl = document.getElementById('coins');
const harvestEl = document.getElementById('harvest');
function refreshHud() {
  coinsEl.textContent = coins;
  harvestEl.textContent = harvested;
}

// ---------- Plot actions ----------
const GROW_TIME = 20; // seconds from planted to grown, when watered
function actOnPlot(plot) {
  const d = plot.userData;
  if (d.state === 'empty') {
    d.state = 'tilled';
    plot.material.color.set(PLOT_COLOURS.tilled);
  } else if (d.state === 'tilled') {
    d.state = 'planted';
    d.timer = 0;
    plot.material.color.set(PLOT_COLOURS.planted);
  } else if (d.state === 'planted') {
    d.watered = true;
  } else if (d.state === 'grown') {
    d.state = 'empty';
    d.watered = false;
    harvested++;
    plot.material.color.set(PLOT_COLOURS.empty);
    refreshHud();
  }
}

// ---------- Controllers ----------
const raycaster = new THREE.Raycaster();
const tmpMat = new THREE.Matrix4();
const pointerGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -6)]);
function setupController(i) {
  const controller = renderer.xr.getController(i);
  rig.add(controller);
  controller.addEventListener('selectstart', () => onSelect(controller));
  controller.add(new THREE.Line(pointerGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));
}
setupController(0);
setupController(1);

function onSelect(controller) {
  tmpMat.identity().extractRotation(controller.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
  const hits = raycaster.intersectObjects(scene.children, true);
  if (!hits.length) return;
  const obj = hits[0].object;
  if (obj.userData.plot) {
    actOnPlot(obj);
  } else if (obj.userData.market) {
    coins += harvested * PRICE;
    harvested = 0;
    refreshHud();
  } else if (obj.userData.teleport) {
    const p = hits[0].point;
    rig.position.set(p.x, 0, p.z);
  }
}

// ---------- Loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const p of plots) {
    const d = p.userData;
    if (d.state === 'planted') {
      d.timer += dt * (d.watered ? 1 : 0.4);
      if (d.timer >= GROW_TIME) {
        d.state = 'grown';
        p.material.color.set(PLOT_COLOURS.grown);
      }
    }
  }
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
